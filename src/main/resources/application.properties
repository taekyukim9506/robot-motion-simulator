# Run the application on the local development port.
server.port=8080

# Keep development data in memory while the application is running.
spring.datasource.url=jdbc:h2:mem:robosim
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create or update database tables from the Java entity classes.
spring.jpa.hibernate.ddl-auto=update

# Keep the database browser disabled.
spring.h2.console.enabled=false

# Connect to Gmail to send account verification emails.
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Read the email address and app password from environment variables.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Authenticate with the mail server and require an encrypted connection.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Limit waiting time if the mail server cannot respond.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Set the application address used in account verification links.
app.base-url=http://localhost:8080